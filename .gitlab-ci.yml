stages:
  - lint
  - test
  - build
  - deploy
  - clear

default:
  image: $DOCKER_REGISTRY_HOST/ci-cd:latest

before_script: chmod -R +x scripts/ci-cd

.prod:
  before_script:
    - !reference [before_script]
    - kubectl config set-context --current --namespace=$K8S_NAMESPACE_PROD

.dev:
  before_script:
    - !reference [before_script]
    - kubectl config set-context --current --namespace=$K8S_NAMESPACE_DEV

.npm-dependencies:
  before_script:
    - !reference [before_script]
    - if [ ! -d node_modules ]; then
    - npm ci
    - fi
  cache:
    key: node_modules-${CI_PROJECT_ID}-${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/

eslint:
  stage: lint
  extends: .npm-dependencies
  script: npm run eslint
  rules:
    - if: $CI_MERGE_REQUEST_ID
  interruptible: true

test:
  stage: test
  extends: .npm-dependencies
  script: npm run test
  rules:
    - if: $CI_MERGE_REQUEST_ID
  interruptible: true

prepare-container:
  stage: build
  script: scripts/ci-cd/prepare_container.sh
  rules:
    - if: $CI_MERGE_REQUEST_ID
      variables:
        ENV: dev
    - if: $CI_COMMIT_BRANCH == $DEV_BRANCH_NAME
      variables:
        ENV: dev
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      variables:
        ENV: prod
  artifacts:
    paths:
      - image_ref
  interruptible: true

deploy-dev:
  stage: deploy
  extends: .dev
  variables:
    SERVICE_NAME: "${CI_PROJECT_PATH_SLUG}-dev"
    SERVICE_DOMAIN: "dev.${K8S_INGRESS_DOMAIN}"
    ENV: dev
  script: scripts/ci-cd/k8s/deploy.sh
  environment:
    name: dev
    url: "https://dev.${K8S_INGRESS_DOMAIN}/"
  rules:
    - if: $CI_COMMIT_BRANCH == $DEV_BRANCH_NAME

deploy-prod:
  stage: deploy
  extends: .prod
  variables:
    SERVICE_NAME: $CI_PROJECT_PATH_SLUG
    SERVICE_DOMAIN: $K8S_INGRESS_DOMAIN
    ENV: prod
  script: scripts/ci-cd/k8s/deploy.sh
  environment:
    name: prod
    url: "https://${K8S_INGRESS_DOMAIN}/"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy-branch:
  stage: deploy
  extends: .dev
  variables:
    SERVICE_NAME: "${CI_PROJECT_PATH_SLUG}-branch-${CI_COMMIT_REF_SLUG}"
    SERVICE_DOMAIN: "${CI_COMMIT_REF_SLUG}.dev.${K8S_INGRESS_DOMAIN}"
    ENV: dev
  script: scripts/ci-cd/k8s/deploy.sh
  environment:
    name: dev/$CI_COMMIT_REF_SLUG
    url: "https://${CI_COMMIT_REF_SLUG}.dev.${K8S_INGRESS_DOMAIN}/"
    on_stop: clear-branch
    auto_stop_in: 1 week
  rules:
    - if: $CI_MERGE_REQUEST_ID
      when: manual

clear-branch:
  stage: clear
  extends: .dev
  variables:
    SERVICE_NAME: "${CI_PROJECT_PATH_SLUG}-branch-${CI_COMMIT_REF_SLUG}"
  script: scripts/ci-cd/k8s/clear_deployment.sh
  environment:
    name: dev/$CI_COMMIT_REF_SLUG
    action: stop
  rules:
    - if: $CI_MERGE_REQUEST_ID
      when: manual

merge-down:
  stage: .post
  before_script:
    - git config --global user.email "$GITLAB_USER_EMAIL"
    - git config --global user.name "$GITLAB_USER_NAME"
    - git remote set-url --push origin $CI_REPOSITORY_URL
  script:
    - |
      git fetch origin $DEV_BRANCH_NAME && \
      git checkout $DEV_BRANCH_NAME && \
      git reset --hard origin/$DEV_BRANCH_NAME && \
      git rebase origin/$CI_DEFAULT_BRANCH && \
      git push origin HEAD:$DEV_BRANCH_NAME && \
      curl --request POST --form "token=$CI_JOB_TOKEN" --form "ref=$DEV_BRANCH_NAME" http://$CI_SERVER_HOST/api/v4/projects/$CI_PROJECT_ID/trigger/pipeline
  after_script:
    - git rebase --abort
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  allow_failure: true
